name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # the formatter on every system, the tools that need bash and git where
  # they are at home
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install -q clang-format==22.1.5

      - name: Test format.py
        run: python tests/test_format.py

      - name: Test the other tools
        if: runner.os != 'Windows'
        run: python tests/test_tools.py

  # the action on the pull requests of this repository
  style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
